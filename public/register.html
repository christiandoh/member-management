<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription — MemberSpace</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .steps-indicator { display:flex; align-items:center; z-index:1; }
    .step-dot { display:flex; flex-direction:column; align-items:center; gap:6px; }
    .step-dot span {
      width:36px; height:36px; border-radius:50%;
      background:rgba(244,243,239,0.08); border:2px solid rgba(244,243,239,0.15);
      display:flex; align-items:center; justify-content:center;
      font-family:var(--font-display); font-weight:700; font-size:0.875rem;
      color:rgba(244,243,239,0.35); transition:all 0.3s;
    }
    .step-dot.active span { background:var(--accent); border-color:var(--accent); color:#fff; }
    .step-dot.done span { background:rgba(76,175,125,0.2); border-color:var(--success); color:var(--success); }
    .step-label { font-size:0.68rem; color:rgba(244,243,239,0.3); text-transform:uppercase; letter-spacing:0.08em; }
    .step-dot.active .step-label { color:rgba(244,243,239,0.65); }
    .step-line { flex:1; height:2px; background:rgba(244,243,239,0.1); margin:0 10px; margin-bottom:26px; min-width:40px; }
    .form-step { animation:slideIn 0.3s ease; }
  </style>
</head>
<body>
<div class="auth-layout">
  <div class="auth-visual">
    <div class="auth-logo">
      <div class="logo-icon">
        <svg width="22" height="22" fill="none" stroke="#fff" stroke-width="2" viewBox="0 0 24 24">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
      </div>
      <span class="logo-text">MemberSpace</span>
    </div>
    <div class="auth-tagline">
      <h1>Rejoignez<br>la communauté.</h1>
      <p>Créez votre profil et connectez-vous avec d'autres membres en quelques étapes.</p>
    </div>
    <div class="steps-indicator">
      <div class="step-dot active" id="dot-1"><span>1</span><div class="step-label">Identité</div></div>
      <div class="step-line"></div>
      <div class="step-dot" id="dot-2"><span>2</span><div class="step-label">Profil</div></div>
      <div class="step-line"></div>
      <div class="step-dot" id="dot-3"><span>3</span><div class="step-label">Photo</div></div>
    </div>
  </div>

  <div class="auth-form-side">
    <div class="auth-form-container">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;">
        <div>
          <h2 id="step-title">Votre identité</h2>
          <p id="step-subtitle">Étape 1 sur 3 — Informations personnelles</p>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" title="Thème">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
        </button>
      </div>

      <form id="register-form" enctype="multipart/form-data">

        <!-- STEP 1 -->
        <div class="form-step" id="step-1">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Prénom</label>
              <input type="text" name="firstName" class="form-input" placeholder="Jean" required>
            </div>
            <div class="form-group">
              <label class="form-label">Nom</label>
              <input type="text" name="lastName" class="form-input" placeholder="Dupont" required>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Numéro de téléphone</label>
            <input type="tel" name="phone" class="form-input" placeholder="Ex: 0700000000" required>
          </div>
          <div class="form-group">
            <label class="form-label">Mot de passe</label>
            <div style="position:relative">
              <input type="password" name="password" id="reg-pw" class="form-input" placeholder="Minimum 6 caractères" required minlength="6" style="padding-right:3rem">
              <button type="button" onclick="togglePw('reg-pw')" style="position:absolute;right:.75rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted)">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <button type="button" class="btn btn-primary btn-full" onclick="goNext(1)">
            Suivant
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>

        <!-- STEP 2 -->
        <div class="form-step" id="step-2" style="display:none">
          <div class="form-group">
            <label class="form-label">Genre</label>
            <select name="gender" class="form-select" required>
              <option value="">Sélectionner...</option>
              <option value="male">Masculin</option>
              <option value="female">Féminin</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Situation matrimoniale</label>
            <select name="maritalStatus" class="form-select" required>
              <option value="">Sélectionner...</option>
              <option value="single">Célibataire</option>
              <option value="married">Marié(e)</option>
              <option value="divorced">Divorcé(e)</option>
              <option value="widowed">Veuf / Veuve</option>
            </select>
          </div>
          <div style="display:flex;gap:1rem;margin-top:.5rem">
            <button type="button" class="btn btn-secondary" style="flex:1" onclick="goPrev(2)">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
              Retour
            </button>
            <button type="button" class="btn btn-primary" style="flex:1" onclick="goNext(2)">
              Suivant
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
          </div>
        </div>

        <!-- STEP 3 -->
        <div class="form-step" id="step-3" style="display:none">
          <div class="form-group">
            <label class="form-label">Photo de profil <span style="color:var(--text-muted)">(optionnel)</span></label>
            <div class="photo-upload-area" id="photo-area">
              <input type="file" name="photo" id="photo-input" accept="image/*" onchange="previewPhoto(this)">
              <img class="photo-preview" id="photo-preview" src="" alt="Aperçu">
              <div class="photo-upload-icon" id="photo-icon">
                <svg width="22" height="22" fill="none" stroke="var(--text-muted)" stroke-width="2" viewBox="0 0 24 24">
                  <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>
                </svg>
              </div>
              <p id="photo-hint">Cliquez ou glissez une image ici</p>
              <p style="font-size:.75rem;color:var(--text-muted);margin-top:4px">JPG, PNG — Max 5 Mo</p>
            </div>
          </div>
          <div style="display:flex;gap:1rem;margin-top:.5rem">
            <button type="button" class="btn btn-secondary" style="flex:1" onclick="goPrev(3)">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
              Retour
            </button>
            <button type="submit" class="btn btn-primary" style="flex:1" id="submit-btn">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
              S'inscrire
            </button>
          </div>
        </div>

      </form>

      <div class="divider"><span>Déjà membre ?</span></div>
      <a href="/" class="btn btn-secondary btn-full">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
        Se connecter
      </a>
    </div>
  </div>
</div>

<div class="toast-container" id="toasts"></div>

<script>
  (function(){ const t = localStorage.getItem('theme')||'light'; document.documentElement.setAttribute('data-theme',t); })();

  function toggleTheme(){
    const c = document.documentElement.getAttribute('data-theme');
    const n = c==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',n);
    localStorage.setItem('theme',n);
  }
  function togglePw(id){ const e=document.getElementById(id); e.type=e.type==='password'?'text':'password'; }

  const titles=['Votre identité','Votre profil','Votre photo'];
  const subs=['Étape 1 sur 3 — Informations personnelles','Étape 2 sur 3 — Situation personnelle','Étape 3 sur 3 — Photo de profil'];

  function showStep(n){
    [1,2,3].forEach(i=>{
      document.getElementById(`step-${i}`).style.display = i===n?'block':'none';
      const dot = document.getElementById(`dot-${i}`);
      dot.classList.remove('active','done');
      if(i===n) dot.classList.add('active');
      else if(i<n) dot.classList.add('done');
    });
    document.getElementById('step-title').textContent = titles[n-1];
    document.getElementById('step-subtitle').textContent = subs[n-1];
  }

  function goNext(from){
    const step = document.getElementById(`step-${from}`);
    const inputs = step.querySelectorAll('input[required],select[required]');
    let ok = true;
    inputs.forEach(i=>{ 
      if(!i.value.trim()){ i.style.borderColor='var(--danger)'; ok=false; }
      else i.style.borderColor='';
    });
    if(!ok){ showToast('Veuillez remplir tous les champs','error'); return; }
    showStep(from+1);
  }
  function goPrev(from){ showStep(from-1); }

  function previewPhoto(input){
    if(input.files && input.files[0]){
      const reader = new FileReader();
      reader.onload = e => {
        const p=document.getElementById('photo-preview');
        p.src=e.target.result; p.style.display='block';
        document.getElementById('photo-icon').style.display='none';
        document.getElementById('photo-hint').textContent=input.files[0].name;
      };
      reader.readAsDataURL(input.files[0]);
    }
  }

  document.getElementById('register-form').addEventListener('submit', async(e)=>{
    e.preventDefault();
    const btn=document.getElementById('submit-btn');
    btn.disabled=true; btn.textContent='Inscription en cours...';
    const fd=new FormData(e.target);
    const res=await fetch('/api/auth/register',{method:'POST',credentials:'include',body:fd});
    const r=await res.json();
    if(r.success){
      showToast('Compte créé avec succès !','success');
      setTimeout(()=>window.location.href='/dashboard',1000);
    } else {
      showToast(r.error||"Erreur lors de l'inscription",'error');
      btn.disabled=false; btn.innerHTML='<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg> S\'inscrire';
    }
  });

  function showToast(msg,type='success'){
    const t=document.createElement('div');
    t.className=`toast ${type}`;
    t.innerHTML=`<span>${type==='success'?'✓':'✕'}</span> ${msg}`;
    document.getElementById('toasts').appendChild(t);
    setTimeout(()=>t.remove(),3500);
  }
</script>
</body>
</html>
